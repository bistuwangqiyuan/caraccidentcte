# 机会评分锚定表 — car accident cte 种子词重建
meta:
  version: "1.0"
  as_of: "2026-08-02"
  scale: [1, 10]
  weight_total: 100
  perturbation:
    method: "uniform_relative"
    magnitude: 0.30
    draws: 20000
  decision_context: >
    评分对象是「单人、每周 ≤20 小时、总运营风险资本 ≤ US$2,000、
    要求零人工运营、纯自有资金精益创业」的在线服务机会。
    合规安全与可执行性权重大于名义市场规模。

kill_gates:
  - id: G1
    name: "合规红线"
    rule: >
      若核心交付在主要目标市场构成未经授权的法律执业（新加坡 Legal Profession Act
      s32/s33：法律意见、有偿协商/和解人身伤亡索赔、诉讼文书起草等），
      或构成未经授权的医疗诊断（如 CTE 临床诊断），或需金融/保险中介牌照才能交付，则淘汰。
    rationale: "单人无牌主体无法合法提供法律意见或医疗诊断；不可执行的高分机会等于零。"
  - id: G2
    name: "零人工可运营"
    rule: >
      若核心价值交付必须依赖人工销售演示、人工审核、律师审稿或电话客服才能成立，则淘汰。
    rationale: "约束条件明确要求全 AI、无人公司模式。"
  - id: G3
    name: "单人可维护"
    rule: >
      若首个可收费版本预计超过 160 小时（8 周全部可用工时），
      或长期运维需要 7×24 值守、多司法辖区实时法条维护，则淘汰。
    rationale: "每周 20 小时是硬约束。"

criteria:
  - id: demand_evidence
    name: "需求可验证性"
    weight: 14
    question: "痛点有多少可查证的外部证据？"
    anchors:
      1: "只有直觉，无第三方数据。"
      3: "有零散社区讨论，无量化。"
      5: "有行业统计表明痛点存在，缺付费证据。"
      7: "有权威统计量化痛点，且有竞品收费存活。"
      9: "有政府/监管一手统计，且有多个公开定价竞品。"
  - id: willingness_to_pay
    name: "付费意愿与客单价"
    weight: 12
    question: "买方能否把支出对应到可衡量收益或已在支付的成本？"
    anchors:
      1: "可选消费，免费替代足够好。"
      3: "有用但难量化，客单价难超 $10。"
      5: "效率工具，客单价约 $10–30 一次或每月。"
      7: "对应明确时间节省或理赔准备成本，客单价 $30–100。"
      9: "直接作用于大额现金或合规风险，预算已存在。"
  - id: compliance_safety
    name: "合规安全度"
    weight: 18
    question: "在不持有法律/医疗/保险中介牌照的前提下，法律暴露面有多小？"
    anchors:
      1: "核心功能即未经授权法律执业或医疗诊断。"
      3: "灰色边缘，靠免责声明维持，随时可能被重释为受监管活动。"
      5: "无牌照要求，但处理大量敏感个人数据，隐私义务重。"
      7: "无牌照要求；主要义务是通用隐私与广告规则；明确不做法律意见。"
      9: "信息工具/清单/打包，不输出过错结论，不碰 PI 和解。"
  - id: automation
    name: "零人工可自动化度"
    weight: 14
    question: "获客、转化、交付、客服、计费、风控能有多少真正无人运行？"
    anchors:
      1: "交付本身是人工服务。"
      3: "交付可自动化，成交必须人工。"
      5: "六环节中约一半可无人。"
      7: "交付/计费/客服 FAQ 可无人；获客需内容投入。"
      9: "六环节均可软件+AI 闭环，人工仅做模型与服务器维护。"
  - id: distribution
    name: "可分发性"
    weight: 12
    question: "在零销售团队下，流量能否以内容/产品驱动获取？"
    anchors:
      1: "必须企业销售团队。"
      3: "高度依赖付费广告且 CAC 难回收。"
      5: "SEO/内容可行但竞争激烈。"
      7: "明确搜索意图 + 可做清单型落地页。"
      9: "存在官方/平台分发入口或极窄高意图关键词。"
  - id: solo_deliverability
    name: "单人 20h 可交付性"
    weight: 14
    question: "每周 20 小时能否在 90 天内做出可收费 MVP？"
    anchors:
      1: "需多辖区法条引擎或重运营。"
      3: "工程量 >160h 或需复杂集成。"
      5: "MVP 约 100–160h，集成中等。"
      7: "MVP ≤100h，单一工作流、单一司法辖区。"
      9: "MVP ≤60h，表单+PDF 打包即可收费。"
  - id: retention_moat
    name: "留存与护城河"
    weight: 8
    question: "用户用完是否必然流失？数据/工作流能否形成切换成本？"
    anchors:
      1: "一次性事件后必然流失，无复购结构。"
      3: "一次性为主，弱推荐。"
      5: "可有轻度复购（再次事故、家人、车队）。"
      7: "订阅或工作流嵌入产生中等粘性。"
      9: "网络效应或独占数据。"
  - id: competitive_gap
    name: "竞争空隙"
    weight: 8
    question: "现有方案留下了什么可占据的空隙？"
    anchors:
      1: "巨头已完美覆盖。"
      3: "有多个成熟竞品。"
      5: "有竞品但不针对本细分或本辖区。"
      7: "本细分几乎无专注产品，用户用通用工具凑合。"
      9: "明确空白且有可辩护差异化。"
