# 候选机会池 — 种子词 car accident cte
meta:
  as_of: "2026-08-02"
  seed_keyword: "car accident cte"
  note: >
    种子词在 Trends 上更可能关联 Chronic Traumatic Encephalopathy（美式 PI SEO），
    而非新加坡「责任认定」品类。候选池同时覆盖：合规安全的事故后工具、
    以及必然被 kill gate 淘汰的「法律意见/CTE 诊断」方向，使淘汰过程本身成为结论。

candidates:
  - id: liability-ai-legal
    branch: "法律意见（红线对照）"
    name: "AI 交通事故责任认定与法律建议 SaaS"
    one_liner: "向车主收费输出过错比例、索赔策略与「法律建议」PDF（原稿主叙事）。"
    gates:
      G1:
        verdict: fail
        reason: >
          新加坡 Legal Profession Act 1966 s32/s33：无执业证不得执业；
          有偿就具体事实给出权利义务意见、有偿协商/和解人身伤亡索赔均属高风险/禁止区。
          「AI + 免责声明」不能创造执业豁免。
        evidence:
          - SG-LPA-S32
          - SG-LPA-S33
          - SG-LAWGAZETTE-UPL
      G2:
        verdict: pass
        reason: "技术上可自动出 PDF，但合规上不可做。"
      G3:
        verdict: pass
        reason: "工程可做，约束在法律而非工时。"
    scores:
      demand_evidence:
        score: 5
        rationale: "事故痛点真实（SPF 有伤亡统计），但「付费买 AI 过错认定」无新加坡付费证据。"
        evidence:
          - SPF-ARTS-2024
      willingness_to_pay:
        score: 4
        rationale: "用户愿为律师付费，但不等于愿为无牌 AI「判决」付费；伦理与信任双重折损。"
      compliance_safety:
        score: 1
        rationale: "核心功能即未经授权法律执业风险。"
        evidence:
          - SG-LPA-S33
      automation:
        score: 7
        rationale: "生成报告可自动化。"
      distribution:
        score: 4
        rationale: "广告平台对法律服务常有资质限制；且宣传违法产品不可取。"
      solo_deliverability:
        score: 6
        rationale: "可做出 demo，但不能合法上线收费。"
      retention_moat:
        score: 2
        rationale: "单次事故后流失；且一旦被认定违规则产品归零。"
      competitive_gap:
        score: 3
        rationale: "空白往往因为违法，不是机会。"

  - id: cte-diagnosis
    branch: "医疗诊断（红线对照）"
    name: "车事故后 CTE 风险诊断 AI"
    one_liner: "基于症状问卷输出 Chronic Traumatic Encephalopathy 风险/诊断建议。"
    gates:
      G1:
        verdict: fail
        reason: >
          CTE 确定性诊断通常依赖尸检病理学；活体「诊断」缺乏公认临床金标准。
          向消费者输出诊断性结论触及医疗误导与潜在无证行医风险，不符合公序良俗与向善原则。
        evidence:
          - CTE-BU-OVERVIEW
          - CTE-UCSF
      G2:
        verdict: fail
        reason: "高风险医疗结论若要合规通常需要持证临床路径，无法零人工成立。"
      G3:
        verdict: pass
        reason: "问卷产品工程量小，但不应做。"
    scores:
      demand_evidence:
        score: 4
        rationale: "美国 PI SEO 对 car accident + CTE 有搜索兴趣，但不是新加坡可验证付费刚需。"
        evidence:
          - CTE-BU-OVERVIEW
      willingness_to_pay:
        score: 2
        rationale: "严肃用户会就医；付费问卷诊断既不可信也不应鼓励。"
      compliance_safety:
        score: 1
        rationale: "医疗诊断红线。"
        evidence:
          - CTE-BU-OVERVIEW
      automation:
        score: 8
        rationale: "问卷可自动化——这也是其危险之处。"
      distribution:
        score: 3
        rationale: "广告审核与平台政策对医疗宣称严格。"
      solo_deliverability:
        score: 8
        rationale: "技术上容易，伦理上不应做。"
      retention_moat:
        score: 1
        rationale: "无。"
      competitive_gap:
        score: 2
        rationale: "空白因科学与伦理约束。"

  - id: evidence-fnol-sg
    branch: "事故后工具"
    name: "新加坡事故后证据包与保险 FNOL 清单"
    one_liner: "引导拍照/保存证据、生成时间线摘要与保险公司第一通知清单，导出 PDF/ZIP；明确不做过错认定与法律意见。"
    gates:
      G1:
        verdict: pass
        reason: >
          定位为信息整理与清单工具：用户自填事实、自选材料；
          不输出过错比例、不起草和解、不代理索赔。配套强硬免责声明与律师目录外链。
        evidence:
          - SG-LPA-S33
          - POSITION-EVIDENCE-PACK
      G2:
        verdict: pass
        reason: "Stripe 支付 + 自动生成 PDF/ZIP + 邮件送达 + FAQ 机器人，可无人运营。"
      G3:
        verdict: pass
        reason: "单一辖区、单一工作流；MVP 估 80 小时 < 160 小时门槛。"
    scores:
      demand_evidence:
        score: 7
        rationale: "SPF 2024 有 7,192 起伤亡事故；GIA 显示车险保费与赔付活跃。痛点可证，付费转化仍待测。"
        evidence:
          - SPF-ARTS-2024
          - SPF-TRAFFIC-ANNUAL-2024
          - GIA-MOTOR-2025
      willingness_to_pay:
        score: 5
        rationale: "S$39 一次性对「整理材料省时间」可论证，但低于律师费；付费意愿待测，故不打高分。"
        evidence:
          - PRICE-BAND-DIY
      compliance_safety:
        score: 8
        rationale: "不做法律意见/PI 和解；主要义务是 PDPA 与真实宣传。仍须严格文案审查。"
        evidence:
          - SG-LPA-S33
          - POSITION-EVIDENCE-PACK
      automation:
        score: 8
        rationale: "六环节均可软件化；获客靠内容而非销售。"
      distribution:
        score: 6
        rationale: "高意图搜索词存在（accident checklist, insurance claim documents SG），但量级有限。"
      solo_deliverability:
        score: 8
        rationale: "表单+模板+打包+支付，适合 20h/周。"
      retention_moat:
        score: 3
        rationale: "事故低频；靠年订家庭包与口碑弱复购，不伪装高留存。"
      competitive_gap:
        score: 7
        rationale: "新加坡缺少专注「证据打包」的轻量产品；用户多用网盘+聊天记录凑合。"

  - id: policy-clause-map
    branch: "事故后工具"
    name: "车险保单条款摘录对照清单"
    one_liner: "用户上传保单 PDF，AI 摘录「需要通知的期限/材料清单」类条款为对照表，不做承保决定。"
    gates:
      G1:
        verdict: pass
        reason: "条款摘录+用户自核对；不输出「你是否获赔」结论，避免保险建议牌照灰色区。"
        evidence:
          - POSITION-EVIDENCE-PACK
      G2:
        verdict: pass
        reason: "上传→解析→表格可自动。"
      G3:
        verdict: pass
        reason: "PDF 解析工作量中等，MVP 可控制在 120h 内。"
    scores:
      demand_evidence:
        score: 5
        rationale: "车险合同复杂是常识级痛点；缺新加坡垂直付费数据。"
        evidence:
          - GIA-MOTOR-2025
      willingness_to_pay:
        score: 4
        rationale: "与保险公司/经纪人免费渠道竞争；客单价压力大。"
      compliance_safety:
        score: 6
        rationale: "若文案滑向「理赔建议」则危险；需极窄功能。"
        evidence:
          - POSITION-EVIDENCE-PACK
      automation:
        score: 7
        rationale: "可自动，但解析错误需要产品内强提示「以保单原文为准」。"
      distribution:
        score: 5
        rationale: "SEO 可行，差异化弱于证据包。"
      solo_deliverability:
        score: 6
        rationale: "PDF 版式多样，工程坑多于清单工具。"
      retention_moat:
        score: 4
        rationale: "换保/续保时可复用。"
      competitive_gap:
        score: 5
        rationale: "通用 PDF AI 已部分覆盖。"

  - id: workshop-quote-log
    branch: "事故后工具"
    name: "修车报价对比记录器"
    one_liner: "结构化记录多家车间报价与照片，导出对比表，供车主自用。"
    gates:
      G1:
        verdict: pass
        reason: "纯记录工具，无法律/医疗主张。"
      G2:
        verdict: pass
        reason: "可全自动。"
      G3:
        verdict: pass
        reason: "MVP 很小。"
    scores:
      demand_evidence:
        score: 3
        rationale: "有用但替代品（电子表格/聊天）极强；查无新加坡垂直付费一手证据，故分 capped 于 3。"
        evidence_absent: "未找到新加坡垂直付费「报价对比 SaaS」的一手证据；痛点多为轶事。"
      willingness_to_pay:
        score: 3
        rationale: "免费表格足够好，付费意愿弱。"
      compliance_safety:
        score: 9
        rationale: "几乎无牌照问题；纯记录工具，不输出法律或医疗结论。"
        evidence:
          - POSITION-EVIDENCE-PACK
      automation:
        score: 9
        rationale: "极易自动化。"
      distribution:
        score: 4
        rationale: "搜索意图弱，获客难。"
      solo_deliverability:
        score: 9
        rationale: "可很快做出。"
      retention_moat:
        score: 2
        rationale: "用完即走。"
      competitive_gap:
        score: 4
        rationale: "空隙存在但商业价值可疑。"

  - id: us-cte-content
    branch: "内容站"
    name: "美国向 car accident + CTE 科普与律师目录站"
    one_liner: "科普 CTE 与脑外伤常识 + Law Society/州律协公开名录链出；不做诊断、不做案件代理、不分享律师费。"
    gates:
      G1:
        verdict: pass
        reason: >
          严格限定为一般性健康/法律信息与公开名录；
          不针对用户事实给出胜诉概率或诊断；不从事 PI 招揽灰色分成（各州规则不同，默认不做收费转介）。
        evidence:
          - CTE-BU-OVERVIEW
          - POSITION-CONTENT-DIR
      G2:
        verdict: pass
        reason: "内容生成+静态站+广告/联盟可自动化；转介若收费则引入人工与合规，本候选默认无收费转介。"
      G3:
        verdict: pass
        reason: "内容站可启动，但英文 SEO 竞争消耗大量持续工时。"
    scores:
      demand_evidence:
        score: 6
        rationale: "种子词 Trends 兴趣与美国 PI 内容生态可观察；变现质量不稳定。"
        evidence:
          - CTE-BU-OVERVIEW
      willingness_to_pay:
        score: 3
        rationale: "主要靠广告 RPM，而非用户付费；ARPU 不确定。"
      compliance_safety:
        score: 5
        rationale: "医疗/法律信息边界需持续文案审查；各州律师广告规则复杂。"
        evidence:
          - POSITION-CONTENT-DIR
      automation:
        score: 7
        rationale: "内容可 AI 辅助，但质量与合规审查仍占维护时间。"
      distribution:
        score: 5
        rationale: "SEO 竞争激烈（美国 PI 内容农场）。"
      solo_deliverability:
        score: 5
        rationale: "20h/周可做，但与「可检验的产品收入」相比更像流量赌博。"
      retention_moat:
        score: 3
        rationale: "内容站护城河弱。"
      competitive_gap:
        score: 3
        rationale: "赛道拥挤。"

  - id: fleet-incident-log
    branch: "B2B 轻量"
    name: "网约车/车队事故记录模板"
    one_liner: "车队管理员用的标准化事故记录与证据文件夹（多司机），导出合规存档包。"
    gates:
      G1:
        verdict: pass
        reason: "企业内部记录工具；不做对外法律意见。"
      G2:
        verdict: pass
        reason: "自助注册+席位订阅可自动；但 B2B 获客常需销售——见评分。"
      G3:
        verdict: pass
        reason: "产品可做；销售周期是风险。"
    scores:
      demand_evidence:
        score: 5
        rationale: "车队有事故记录需求；缺公开付费数据。"
        evidence:
          - SPF-ARTS-2024
      willingness_to_pay:
        score: 6
        rationale: "B2B 预算强于 C 端，但成交周期长。"
      compliance_safety:
        score: 7
        rationale: "相对安全；企业内部记录，不做对外法律意见；注意员工个人数据。"
        evidence:
          - POSITION-EVIDENCE-PACK
      automation:
        score: 6
        rationale: "交付可自动；获客难全自动。"
      distribution:
        score: 3
        rationale: "缺零销售分发入口，倾向人工 BD。"
      solo_deliverability:
        score: 5
        rationale: "多租户与权限增加工程量。"
      retention_moat:
        score: 6
        rationale: "工作流嵌入后粘性较好。"
      competitive_gap:
        score: 5
        rationale: "与车队管理套件功能重叠。"
